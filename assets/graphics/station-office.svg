    <linearGradient id="o-wall" x2="0" y2="1"><stop stop-color="#24272d"/><stop offset="1" stop-color="#191b20"/></linearGradient>
    <linearGradient id="o-desk" x2="0" y2="1"><stop stop-color="#42454b"/><stop offset=".15" stop-color="#25282e"/><stop offset="1" stop-color="#15171b"/></linearGradient>
  </defs>
