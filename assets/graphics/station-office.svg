<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="office-title office-desc">
  <title id="office-title">站務室控制台</title>
  <desc id="office-desc">深色極簡站務室，桌上有檢修盒與控制台。控制台用長波、短波和雙短波顯示音序線索。</desc>
  <defs>
