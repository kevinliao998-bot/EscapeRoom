<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="platform-title platform-desc">
  <title id="platform-title">月台維修走廊</title>
  <desc id="platform-desc">深色月台走廊延伸至遠處的維修出口。牆上路線圖顯示入口、分岔、維修節點和出口，供電節點以穩定香檳金光點呈現。</desc>
