    <linearGradient id="p-floor" x2="0" y2="1"><stop stop-color="#34373d"/><stop offset="1" stop-color="#111317"/></linearGradient>
    <radialGradient id="p-lamp"><stop stop-color="#cbb18b" stop-opacity=".65"/><stop offset="1" stop-color="#cbb18b" stop-opacity="0"/></radialGradient>
  </defs>
